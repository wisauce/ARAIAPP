name: araiap

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-araiap}
      POSTGRES_USER: ${POSTGRES_USER:-araiap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-araiap_dev_only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-araiap} -d ${POSTGRES_DB:-araiap}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      ARAIAP_DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://araiap:araiap_dev_only@postgres:5432/araiap}
      ARAIAP_STORAGE_BACKEND: local
      ARAIAP_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-http://192.168.100.183:8000}
      ARAIAP_LOCAL_STORAGE_DIR: /app/data
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - api-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  api-data:
