[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "araiap-backend"
version = "0.1.0"
description = "Araiap indoor navigation MVP backend"
requires-python = ">=3.11,<3.12"
dependencies = [
  "alembic>=1.13,<2",
  "boto3>=1.34,<2",
  "fastapi>=0.115,<1",
  "geoalchemy2>=0.15,<1",
  "greenlet>=3.0,<4",
  "pillow>=10.4,<12",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1",
  "shapely>=2.0,<3",
  "sqlalchemy[asyncio]>=2.0.35,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "aiosqlite>=0.20,<1",
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
